<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Completa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 70%;
            margin:  auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        thead {
            background-color: #2c3e50;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tbody, tr:hover {
            background-color: #f1f1f1;
        }

        tfoot {
            background-color: #ecf0f1;
            font-weight: bold;
        }

        .aprovado {
            color: green;
            font-weight: bold;
        }

        .reprovado {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Relatório de Notas</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Matéria</th>
                <th>Nota</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Lucas</td>
                <td>Programação</td>
                <td>8.0</td>
                <td class="aprovado">Aprovado</td>
            </tr>

            <tr>
                <td>Ana</td>
                <td>Biologia</td>
                <td>6.0</td>
                <td class="reprovado">Reprovado</td>
            </tr>

            <tr>
                <td>Pedro</td>
                <td>Matemática</td>
                <td>8.0</td>
                <td class="aprovado">Aprovado</td>
            </tr>

            <tr>
                <td>Marina</td>
                <td>Química</td>
                <td>5.5</td>
                <td class="reprovado">Reprovado</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Média Geral</td>
                <td colspan="2">7.25</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
