<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Aluno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Cadastro de Aluno</h1>

  <form action="#" method="post" autocomplete="on">

    <fieldset>
      <legend>Dados Pessoais</legend>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required minlength="3" maxlength="100" placeholder="Nome completo" autofocus>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required minlength="6">

      <label for="idade">Idade:</label>
      <input type="number" id="idade" name="idade" min="0" max="120" step="1">

      <label for="nascimento">Data de nascimento:</label>
      <input type="date" id="nascimento" name="nascimento">

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" placeholder="Apenas números">

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" pattern="\d{11}" placeholder="Somente números">

    </fieldset>

    <fieldset>
      <legend>Endereço</legend>

      <label for="rua">Rua:</label>
      <input type="text" id="rua" name="rua">

      <label for="numero">Número:</label>
      <input type="number" id="numero" name="numero">

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade">

      <label for="estado">Estado:</label>
      <input type="text" id="estado" name="estado" maxlength="2">

      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" pattern="\d{8}">

    </fieldset>

    <fieldset>
      <legend>Informações Acadêmicas</legend>

      <label for="curso">Curso:</label>
      <select id="curso" name="curso" required>
        <option value="">Selecione</option>
        <option value="ads">ADS</option>
        <option value="eng">Engenharia</option>
        <option value="design">Design</option>
      </select>

      <label>Período:</label>
      <input type="radio" name="periodo" value="manha" required> Manhã
      <input type="radio" name="periodo" value="tarde"> Tarde
      <input type="radio" name="periodo" value="noite"> Noite

      <label>Interesses:</label>
      <input type="checkbox" name="interesse" value="frontend"> Front-end
      <input type="checkbox" name="interesse" value="backend"> Back-end
      <input type="checkbox" name="interesse" value="dados"> Dados

      <label for="nota">Nota de entrada:</label>
      <input type="range" id="nota" name="nota" min="0" max="10">

      <label for="cor">Cor favorita:</label>
      <input type="color" id="cor" name="cor">

      <label for="site">Site pessoal:</label>
      <input type="url" id="site" name="site">

      <label for="busca">Buscar algo:</label>
      <input type="search" id="busca" name="busca">

      <label for="hora">Horário de estudo:</label>
      <input type="time" id="hora" name="hora">

      <label for="mes">Mês de ingresso:</label>
      <input type="month" id="mes" name="mes">

      <label for="semana">Semana:</label>
      <input type="week" id="semana" name="semana">

      <label for="arquivo">Enviar documento:</label>
      <input type="file" id="arquivo" name="arquivo">

    </fieldset>

    <fieldset>
      <legend>Observações</legend>

      <label for="comentarios">Comentários:</label>
      <textarea id="comentarios" name="comentarios" rows="4" placeholder="Digite algo..."></textarea>

    </fieldset>

    <button type="submit">Cadastrar</button>
    <button type="reset">Limpar</button>

  </form>

</body>
</html>
